const readings={1:['いち','に','さん','し','ご','ろく','しち','はち','く'],2:['に','に','さん','し','ご','ろく','しち','はち','く'],3:['さん','に','さん','し','ご','ろく','しち','はち','く'],4:['し','に','さん','し','ご','ろく','しち','はち','く'],5:['ご','に','さん','し','ご','ろく','しち','はち','く'],6:['ろく','に','さん','し','ご','ろく','しち','はち','く'],7:['しち','に','さん','し','ご','ろく','しち','はち','く'],8:['はち','に','さん','し','ご','ろく','しち','はち','く'],9:['く','に','さん','し','ご','ろく','しち','はち','く']};
const special={'1-1':'いんいちがいち','1-2':'いんにがに','1-3':'いんさんがさん','1-4':'いんしがし','1-5':'いんごがご','1-6':'いんろくがろく','1-7':'いんしちがしち','1-8':'いんはちがはち','1-9':'いんくがく','2-1':'にいちがに','2-2':'ににんがし','2-3':'にさんがろく','2-4':'にしがはち','2-5':'にごじゅう','2-6':'にろくじゅうに','2-7':'にしちじゅうし','2-8':'にはちじゅうろく','2-9':'にくじゅうはち','3-1':'さんいちがさん','3-2':'さんにがろく','3-3':'さざんがく','3-4':'さんしじゅうに','3-5':'さんごじゅうご','3-6':'さぶろくじゅうはち','3-7':'さんしちにじゅういち','3-8':'さんぱにじゅうし','3-9':'さんくにじゅうしち','4-1':'しいちがし','4-2':'しにがはち','4-3':'しさんじゅうに','4-4':'ししじゅうろく','4-5':'しごにじゅう','4-6':'しろくにじゅうし','4-7':'ししちにじゅうはち','4-8':'しはさんじゅうに','4-9':'しくさんじゅうろく','5-1':'ごいちがご','5-2':'ごにじゅう','5-3':'ごさんじゅうご','5-4':'ごしにじゅう','5-5':'ごごにじゅうご','5-6':'ごろくさんじゅう','5-7':'ごしちさんじゅうご','5-8':'ごはしじゅう','5-9':'ごっくしじゅうご','6-1':'ろくいちがろく','6-2':'ろくにじゅうに','6-3':'ろくさんじゅうはち','6-4':'ろくしにじゅうし','6-5':'ろくごさんじゅう','6-6':'ろくろくさんじゅうろく','6-7':'ろくしちしじゅうに','6-8':'ろくはしじゅうはち','6-9':'ろっくごじゅうし','7-1':'しちいちがしち','7-2':'しちにじゅうし','7-3':'しちさんにじゅういち','7-4':'しちしにじゅうはち','7-5':'しちごさんじゅうご','7-6':'しちろくしじゅうに','7-7':'しちしちしじゅうく','7-8':'しちはごじゅうろく','7-9':'しちくろくじゅうさん','8-1':'はちいちがはち','8-2':'はちにじゅうろく','8-3':'はっさんにじゅうし','8-4':'はっしさんじゅうに','8-5':'はちごしじゅう','8-6':'はちろくしじゅうはち','8-7':'はちしちごじゅうろく','8-8':'はっぱろくじゅうし','8-9':'はっくしちじゅうに','9-1':'くいちがく','9-2':'くにじゅうはち','9-3':'くさんにじゅうしち','9-4':'くしさんじゅうろく','9-5':'くごしじゅうご','9-6':'くろくごじゅうし','9-7':'くしちろくじゅうさん','9-8':'くはしちじゅうに','9-9':'くくはちじゅういち'};
const numbers=['','いち','に','さん','し','ご','ろく','しち','はち','く','じゅう','じゅういち','じゅうに','じゅうさん','じゅうし','じゅうご','じゅうろく','じゅうしち','じゅうはち','じゅうく','にじゅう'];function numberRead(n){if(n<=20)return numbers[n];let t=Math.floor(n/10),u=n%10;return (t===2?'にじゅう':t===3?'さんじゅう':t===4?'しじゅう':t===5?'ごじゅう':t===6?'ろくじゅう':t===7?'しちじゅう':'はちじゅう')+(u?numbers[u]:'')}
function phrase(d,n){return special[d+'-'+n]||readings[d][0]+readings[d][n-1]+(d*n<10?'が':'')+numberRead(d*n)}
function splitPhrase(d,n){let s=phrase(d,n),v=numberRead(d*n);if(s.endsWith(v))return [s.slice(0,-v.length),v];let prefix=readings[d][0]+readings[d][n-1];return [s.slice(0,prefix.length),s.slice(prefix.length)]}
const species=['🐲','🦊','🐸','🐧','🦉','🐙','🦄','🐢','🐼','🦋','🐝','🦖','🐳','🦀','🐺','🐱','🐻','🦁','🐨','🐯','🐰','🐿️','🐊','🦜','🐬','🦔','🦩','🐘','🦕','🐉'];
let state;try{state=JSON.parse(localStorage.getItem('kuku-save-v1'))||{points:0,owned:[],clears:{}}}catch(e){state={points:0,owned:[],clears:{}}}
let dan=1,group=0,questions=[],index=0,answered=false,correct=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('kuku-save-v1',JSON.stringify(state))}catch(e){$('saveStatus').textContent='ほぞんできません。ブラウザの設定を確認してください。';alert('進みぐあいを保存できませんでした。ブラウザの空き容量や設定を確認してください。')}}function speak(t){if(!('speechSynthesis'in window))return alert('このブラウザは読み上げに対応していません');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.78;speechSynthesis.speak(u)}function show(id){if('speechSynthesis' in window)speechSynthesis.cancel();['home','select','learn','quiz','result','collection','gacha'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='home'||id==='select')home();if(id==='learn')renderLearn();if(id==='collection')collection();if(id==='gacha')renderGacha();window.scrollTo(0,0)}
function home(){updatePoints();$('roomFriends').innerHTML=(state.favorites||[]).map(i=>'<div class="room-friend">'+character(i)+'</div>').join('')||'<p class="room-empty">九九をおぼえて<br>なかまをむかえよう</p>';$('totalProgress').textContent='クリアしたれんしゅう：'+Object.keys(state.clears).length+' / 27';$('danButtons').innerHTML='';for(let d=1;d<=9;d++){let b=document.createElement('button');b.textContent=d+'のだん'+([0,1,2].every(g=>state.clears[d+'-'+g])?' ✓':'');b.className=d===dan?'active':'';b.onclick=()=>{dan=d;group=0;show('learn')};$('danButtons').append(b)}}
function renderLearn(){$('learnTitle').textContent=dan+'のだん';$('groupLabel').textContent='その'+(group+1)+' / 3　（'+(group*3+1)+'〜'+(group*3+3)+'）'+(state.clears[dan+'-'+group]?' ✓ クリア':'');$('lines').innerHTML='';for(let n=group*3+1;n<=group*3+3;n++){let line=document.createElement('div');line.className='line';let span=document.createElement('span');span.textContent=phrase(dan,n);let btn=document.createElement('button');btn.textContent='🔊';btn.onclick=()=>speak(phrase(dan,n));line.append(span,btn);$('lines').append(line)}}
function speakGroup(){speak([1,2,3].map(x=>phrase(dan,group*3+x)).join('。'))}function changeGroup(delta){group=Math.max(0,Math.min(2,group+delta));renderLearn()}
function startQuiz(){questions=[1,2,3].map(x=>group*3+x);for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}index=0;correct=0;show('quiz');renderQuestion()}
function renderQuestion(){answered=false;$('next').classList.add('hidden');$('feedback').textContent='';let n=questions[index],parts=splitPhrase(dan,n);$('question').textContent=parts[0]+' ○○';$('quizProgress').textContent=dan+'のだん　'+(index+1)+' / '+questions.length;$('bar').style.width=((index)/questions.length*100)+'%';let answers=[parts[1]];let candidates=[];for(let j=1;j<=9;j++){if(j!==n)candidates.push(splitPhrase(dan,j)[1])}candidates=[...new Set(candidates)].filter(x=>x!==parts[1]);candidates.sort(()=>Math.random()-.5);answers.push(...candidates.slice(0,3));answers.sort(()=>Math.random()-.5);$('choices').innerHTML='';answers.forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>choose(a,parts[1],n);$('choices').append(b)})}
function choose(a,expected,n){if(answered)return;answered=true;let ok=a===expected;if(ok){correct++;state.points+=10;save();updatePoints();}$('feedback').textContent=ok?'せいかい！ ＋10ポイント':'おしい！ '+phrase(dan,n)+' だよ';speak(phrase(dan,n));[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===expected)b.style.background='#91e7ad';else if(b.textContent===a&&!ok)b.style.background='#ff9b9b'});$('next').textContent=index===questions.length-1?'けっかをみる ▶':'つぎへ ▶';$('next').classList.remove('hidden')}
function nextQuestion(){index++;if(index<questions.length)renderQuestion();else finish()}
function finish(){if(correct===3)state.clears[dan+'-'+group]=true;save();$('rewardEmoji').textContent=correct===3?'🌟':'☘';$('rewardTitle').textContent=correct+' / 3 もん せいかい';$('rewardDesc').textContent='このれんしゅうで ＋'+(correct*10)+'ポイント！';show('result')}
const palettes=['#efca79','#a8c9d7','#b9cf9b','#d7c7a4','#b2d6c7'];
function character(i){let c=palettes[i%5],ear=i%3===0?'<ellipse cx="31" cy="29" rx="10" ry="23" fill="'+c+'"/><ellipse cx="69" cy="29" rx="10" ry="23" fill="'+c+'"/>':i%3===1?'<path d="M18 45L20 14L43 33M57 33L80 14L82 45" fill="'+c+'"/>':'<circle cx="24" cy="32" r="14" fill="'+c+'"/><circle cx="76" cy="32" r="14" fill="'+c+'"/>';return '<svg viewBox="0 0 100 110" role="img" aria-label="なかま '+(i+1)+'"><g stroke="#645b4b" stroke-width="3" stroke-linejoin="round">'+ear+'<ellipse cx="50" cy="71" rx="33" ry="32" fill="'+c+'"/><ellipse cx="50" cy="52" rx="36" ry="29" fill="'+c+'"/></g><circle cx="38" cy="52" r="3" fill="#514b41"/><circle cx="62" cy="52" r="3" fill="#514b41"/><path d="M46 62Q50 66 54 62" fill="none" stroke="#514b41" stroke-width="2.5" stroke-linecap="round"/></svg>'}
if(!Array.isArray(state.favorites))state.favorites=[];
function updatePoints(){$('points').textContent='✦ '+state.points+' pt'}
function renderGacha(){updatePoints();$('gachaBalance').textContent='もっているポイント：'+state.points+' pt';$('drawButton').disabled=state.points<100;$('gachaHint').textContent=state.points<100?'あと '+(100-state.points)+'ポイントで ひけるよ':'1かい100ポイント。同じこがでることもあるよ。'}
function drawGacha(){if(state.points<100)return;state.points-=100;let i=Math.floor(Math.random()*species.length),fresh=!state.owned.includes(i);if(fresh)state.owned.push(i);save();renderGacha();let r=$('gachaResult');r.classList.remove('hidden');r.innerHTML='<p>'+ (fresh?'あたらしい なかま！':'また あそびにきたよ！')+'</p><div class="reward-friend">'+character(i)+'</div><h2>なかま '+(i+1)+'</h2><p class="muted">'+(fresh?'キャラクターに なかまいり！':'すでに なかまになっているこだよ。')+'</p><button onclick="show(\'collection\')">おへやにおく ▶</button>';}
function toggleFavorite(i){if(!state.owned.includes(i))return;let at=state.favorites.indexOf(i);if(at>=0)state.favorites.splice(at,1);else if(state.favorites.length<3)state.favorites.push(i);else{alert('おへやにおけるのは3にんまで。だれかを はずしてね。');return}save();collection()}
function collection(){$('collectionCount').textContent=state.owned.length+' / '+species.length+' しゅるい ・ おへや '+state.favorites.length+' / 3';$('monsters').innerHTML='';species.forEach((e,i)=>{let d=document.createElement('div');d.className='friend-card center';if(state.owned.includes(i)){d.innerHTML=character(i)+'<p>なかま '+(i+1)+'</p>';let b=document.createElement('button');b.textContent=state.favorites.includes(i)?'✓ おへやからはずす':'おへやにおく';b.onclick=()=>toggleFavorite(i);d.append(b)}else d.innerHTML='<div class="unknown">？</div><p class="small muted">まだであっていない</p>';$('monsters').append(d)})}home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
