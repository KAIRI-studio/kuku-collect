const numbers=['','いち','に','さん','し','ご','ろく','しち','はち','く','じゅう','じゅういち','じゅうに','じゅうさん','じゅうし','じゅうご','じゅうろく','じゅうしち','じゅうはち','じゅうく','にじゅう'];function numberRead(n){if(n<=20)return numbers[n];let t=Math.floor(n/10),u=n%10;return (t===2?'にじゅう':t===3?'さんじゅう':t===4?'しじゅう':t===5?'ごじゅう':t===6?'ろくじゅう':t===7?'しちじゅう':'はちじゅう')+(u?numbers[u]:'')}
function phrase(d,n){return special[d+'-'+n]||readings[d][0]+readings[d][n-1]+(d*n<10?'が':'')+numberRead(d*n)}
function splitPhrase(d,n){let s=phrase(d,n),v=numberRead(d*n);if(s.endsWith(v))return [s.slice(0,-v.length),v];let prefix=readings[d][0]+readings[d][n-1];return [s.slice(0,prefix.length),s.slice(prefix.length)]}

if(state.rosterVersion!==1){let old=[...new Set(state.owned||[])];let oldFav=state.favorites||[];state.owned=old.slice(0,3).map((_,i)=>i);state.favorites=[...new Set(oldFav.map(i=>old.indexOf(i)).filter(i=>i>=0&&i<3))];state.rosterVersion=1;try{localStorage.setItem('kuku-save-v1',JSON.stringify(state))}catch(e){}}

const TEST_ALL_CHARACTERS=true;if(TEST_ALL_CHARACTERS){state.owned=[0,1,2];if(!state.testRosterPlaced){state.favorites=[0,1,2];state.testRosterPlaced=true}try{localStorage.setItem('kuku-save-v1',JSON.stringify(state))}catch(e){}}
let dan=1,group=0,questions=[],index=0,answered=false,correct=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('kuku-save-v1',JSON.stringify(state))}catch(e){$('saveStatus').textContent='ほぞんできません。ブラウザの設定を確認してください。';alert('進みぐあいを保存できませんでした。ブラウザの空き容量や設定を確認してください。')}}let speechRun=0,speechActive=false,speechAll=false;
function clearSpeechUI(){document.querySelectorAll('#lines .line').forEach(l=>{l.classList.remove('is-speaking');let b=l.querySelector('button');if(b){b.classList.remove('is-speaking');b.removeAttribute('aria-pressed');if(b.dataset.original)b.innerHTML=b.dataset.original}});let all=document.querySelector('.all-sounds');if(all){all.classList.remove('is-speaking');all.setAttribute('aria-pressed','false');let t=all.querySelector('.step-copy strong');if(t)t.textContent='まとめてきく'}let status=document.querySelector('#speechStatus');if(status)status.textContent='';}
function stopSpeech(){speechRun++;speechActive=false;speechAll=false;if('speechSynthesis'in window)speechSynthesis.cancel();clearSpeechUI()}
function playSpeech(items,all=false){if(!('speechSynthesis'in window))return alert('このブラウザは読み上げに対応していません');stopSpeech();let run=speechRun;speechActive=true;speechAll=all;let k=0;
function next(){if(run!==speechRun)return;if(k>=items.length){speechActive=false;speechAll=false;clearSpeechUI();return}let text=items[k++],u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.78;
u.onstart=()=>{if(run!==speechRun)return;clearSpeechUI();document.querySelectorAll('#lines .line').forEach(l=>{if(l.querySelector('span')?.textContent===text){l.classList.add('is-speaking');let b=l.querySelector('button');if(!b.dataset.original)b.dataset.original=b.innerHTML;b.textContent='停止';b.setAttribute('aria-pressed','true')}});let button=document.querySelector('.all-sounds');if(all&&button){button.classList.add('is-speaking');button.setAttribute('aria-pressed','true');let t=button.querySelector('.step-copy strong');if(t)t.textContent='再生中・とめる'}let status=document.querySelector('#speechStatus');if(status)status.textContent=all?'再生中 '+k+' / '+items.length:'再生中';};
u.onend=()=>{if(run===speechRun)next()};u.onerror=()=>{if(run===speechRun){speechActive=false;speechAll=false;clearSpeechUI();let status=document.querySelector('#speechStatus');if(status)status.textContent='再生できませんでした。もう一度おしてね。'}};speechSynthesis.speak(u)}next()}

function choose(a,expected,n){if(answered)return;answered=true;let ok=a===expected;if(ok){correct++;state.points+=10;save();updatePoints();if($('points').animate)$('points').animate([{transform:'scale(1)'},{transform:'scale(1.16)',background:'#f4d17c'},{transform:'scale(1)'}],{duration:550});}$('feedback').textContent=ok?'せいかい！ 10ポイント ゲット！':'おしい！ '+phrase(dan,n)+' だよ';$('question').textContent=phrase(dan,n);$('quizEquation').textContent=dan+' × '+n+' ＝ '+(dan*n);speak(phrase(dan,n));[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===expected)b.style.background='#91e7ad';else if(b.textContent===a&&!ok)b.style.background='#ff9b9b'});$('next').textContent=index===questions.length-1?'けっかをみる ▶':'つぎへ ▶';$('next').classList.remove('hidden')}

function character(i,walking=false){if(!rigAssets[i])return '';let a=rigAssets[i];function part(n,x,y,w,h){return '<svg x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" viewBox="'+a.parts[n].join(' ')+'" preserveAspectRatio="none" style="overflow:hidden"><image href="'+a.src+'" width="'+a.w+'" height="'+a.h+'"/></svg>'}return '<svg class="character-art puppet-art" viewBox="-12 0 124 120" role="img" aria-label="'+species[i]+'"><ellipse cx="50" cy="116" rx="25" ry="2" fill="#593d25" opacity=".12"/>'+['front','side','back'].map((d,k)=>{let br=a.parts[k*3],bh=90,bw=bh*br[2]/br[3],bx=50-bw*a.hips[k];function leg(n,cx,flip){let r=a.parts[n],h=32,w=h*r[2]/r[3],x=cx-w/2;let art=part(n,x,84,w,h);return flip?'<g transform="translate('+(2*cx)+' 0) scale(-1 1)">'+art+'</g>':art}return '<g class="rig-view rig-'+d+'" style="display:'+(k===0?'inline':'none')+'"><g class="rig-foot rig-far">'+leg(k*3+2,d==='side'?55:63,false)+'</g><g class="rig-foot rig-near">'+leg(k*3+1,d==='side'?45:37,i===2&&d!=='side')+'</g><g class="rig-body">'+part(k*3,bx,11,bw,bh)+'</g></g>'}).join('')+'</svg>'}
function poseRig(v,view,phase,moving,t=0){let feet=[v.querySelector('.rig-near'),v.querySelector('.rig-far')];feet.forEach((foot,j)=>{let p=phase+j*Math.PI,sw=Math.sin(p);let x=moving?(view==='side'?sw*9:0):0,y=moving?-Math.max(0,Math.cos(p))*2.2:0;foot.setAttribute('transform','translate('+x+' '+y+')')});let bob=moving?-Math.abs(Math.sin(phase))*.35:Math.sin(t/1000*2)*.35;v.querySelector('.rig-body').setAttribute('transform','translate(0 '+bob+')')}
let walkFrame=0,roomWalkers=[];
function stopRoomWalk(){cancelAnimationFrame(walkFrame);walkFrame=0}
function startRoomWalk(){stopRoomWalk();if($('home').classList.contains('hidden'))return;let area=$('roomFriends'),room=$('home').querySelector('.room-art');let sceneW=room?room.clientWidth:area.parentElement.clientWidth;area.style.setProperty('height',sceneW*.23+'px','important');area.style.setProperty('bottom',sceneW*.045+'px','important');let aw=area.clientWidth,ah=area.clientHeight;function destination(w){let x,y;do{x=Math.random()*(aw-w.el.offsetWidth);y=Math.random()*ah}while(x>aw*.67&&y<ah*.28);w.tx=x;w.ty=y;w.speed=15+Math.random()*6}
roomWalkers=[...area.querySelectorAll('.room-friend')].map((el,i)=>{let w={el,x:(aw-el.offsetWidth)*(i+1)/(area.children.length+1),y:ah*(.35+i*.22),phase:Math.random()*Math.PI*2,wait:1+i*.5,view:'front',face:1,speed:18};destination(w);return w});let last=0;function tick(t){let dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!$('home').classList.contains('hidden')&&!document.hidden){for(let w of roomWalkers){let moving=false;if(w.wait>0){w.wait-=dt;w.view='front';w.face=1;if(w.wait<=0)destination(w)}else{let dx=w.tx-w.x,dy=w.ty-w.y,dist=Math.hypot(dx,dy);if(dist<1){w.wait=1.5+Math.random()*3}else{let step=Math.min(dist,w.speed*dt);w.x+=dx/dist*step;w.y+=dy/dist*step;w.phase+=step/15*Math.PI*2;moving=true;if(Math.abs(dy)>Math.abs(dx)*.8){w.view=dy<0?'back':'front';w.face=1}else{w.view='side';w.face=dx<0?-1:1}}}
let depth=w.y/ah,scale=1;w.el.style.transform='translate('+w.x+'px,'+(w.y-ah)+'px) scale('+scale+')';w.el.style.zIndex=String(Math.round(100+depth*100));w.el.classList.toggle('is-walking',moving);w.el.dataset.direction=w.view;w.el.querySelector('.walk-facing').style.transform='scaleX('+w.face+')';let phase=w.phase;w.el.querySelectorAll('.rig-view').forEach(v=>{let on=v.classList.contains('rig-'+w.view);v.style.display=on?'inline':'none';if(!on)return;poseRig(v,w.view,phase,moving,t)})}}walkFrame=requestAnimationFrame(tick)}walkFrame=requestAnimationFrame(tick)}
if(!Array.isArray(state.favorites))state.favorites=[];
function updatePoints(){$('points').textContent='✦ '+state.points+' pt'}
function renderGacha(){updatePoints();$('gachaBalance').textContent='もっているポイント：'+state.points+' pt';$('drawButton').disabled=state.points<100;$('gachaHint').textContent=state.points<100?'あと '+(100-state.points)+'ポイントで ひけるよ':'1かい100ポイント。同じこがでることもあるよ。'}
function drawGacha(){if(state.points<100)return;state.points-=100;let i=Math.floor(Math.random()*species.length),fresh=!state.owned.includes(i);if(fresh)state.owned.push(i);save();renderGacha();let r=$('gachaResult');r.classList.remove('hidden');r.innerHTML='<p>'+ (fresh?'あたらしい なかま！':'また あそびにきたよ！')+'</p><div class="reward-friend">'+character(i)+'</div><h2>'+species[i]+'</h2><p class="muted">'+(fresh?'キャラクターに なかまいり！':'すでに なかまになっているこだよ。')+'</p><button onclick="show(\'collection\')">おへやにおく ▶</button>';}
function toggleFavorite(i){if(!state.owned.includes(i))return;let at=state.favorites.indexOf(i);if(at>=0)state.favorites.splice(at,1);else if(state.favorites.length<3)state.favorites.push(i);else{alert('おへやにおけるのは3にんまで。だれかを はずしてね。');return}save();collection()}
function collection(){$('collectionCount').textContent=state.owned.length+' / '+species.length+' しゅるい ・ おへや '+state.favorites.length+' / 3';$('monsters').innerHTML='';species.forEach((e,i)=>{let d=document.createElement('div');d.className='friend-card center';if(state.owned.includes(i)){d.innerHTML=character(i)+'<p>'+species[i]+'</p>';let b=document.createElement('button');b.textContent=state.favorites.includes(i)?'✓ おへやからはずす':'おへやにおく';b.onclick=()=>toggleFavorite(i);d.append(b)}else d.innerHTML='<div class="unknown">？</div><p class="small muted">まだであっていない</p>';$('monsters').append(d)})}home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});

if(new URLSearchParams(location.search).has('walk-review')){stopRoomWalk();document.querySelector('.app').style.display='none';let board=document.createElement('div');board.id='walk-review';board.style='padding:20px;background:#faf3e3;color:#573e25;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:absolute;inset:0;overflow:auto;z-index:999';document.body.append(board);for(let i=0;i<3;i++)for(let dir of ['front','side','back']){if(new URLSearchParams(location.search).has('focus')&&(i!==Number(new URLSearchParams(location.search).get('focus'))||dir!==(new URLSearchParams(location.search).get('direction')||'front')))continue;if(new URLSearchParams(location.search).has('focus'))board.style.gridTemplateColumns='1fr';let card=document.createElement('div');card.style='background:#fffdf5;border:1px solid #c8b995;border-radius:12px;padding:10px';card.innerHTML='<b>'+species[i]+' / '+dir+'</b><div style="display:flex"></div>';let row=card.querySelector('div');for(let phase of [0,Math.PI/2,Math.PI,Math.PI*1.5]){let holder=document.createElement('div');holder.style='width:25%';holder.innerHTML=character(i,true);row.append(holder);let svg=holder.querySelector('svg');svg.style=new URLSearchParams(location.search).has('focus')?'width:100%;height:450px':'width:100%;height:130px';svg.querySelectorAll('.rig-view').forEach(v=>{v.style.display=v.classList.contains('rig-'+dir)?'inline':'none';if(v.style.display==='inline')poseRig(v,dir,phase,true)});}board.append(card)}}
</script></body></html>
