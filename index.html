const numbers=['','いち','に','さん','し','ご','ろく','しち','はち','く','じゅう','じゅういち','じゅうに','じゅうさん','じゅうし','じゅうご','じゅうろく','じゅうしち','じゅうはち','じゅうく','にじゅう'];function numberRead(n){if(n<=20)return numbers[n];let t=Math.floor(n/10),u=n%10;return (t===2?'にじゅう':t===3?'さんじゅう':t===4?'しじゅう':t===5?'ごじゅう':t===6?'ろくじゅう':t===7?'しちじゅう':'はちじゅう')+(u?numbers[u]:'')}
function phrase(d,n){return special[d+'-'+n]||readings[d][0]+readings[d][n-1]+(d*n<10?'が':'')+numberRead(d*n)}
function splitPhrase(d,n){let s=phrase(d,n),v=numberRead(d*n);if(s.endsWith(v))return [s.slice(0,-v.length),v];let prefix=readings[d][0]+readings[d][n-1];return [s.slice(0,prefix.length),s.slice(prefix.length)]}

let dan=1,group=0,questions=[],index=0,answered=false,correct=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('kuku-save-v1',JSON.stringify(state))}catch(e){$('saveStatus').textContent='ほぞんできません。ブラウザの設定を確認してください。';alert('進みぐあいを保存できませんでした。ブラウザの空き容量や設定を確認してください。')}}let speechRun=0,speechActive=false,speechAll=false;
function clearSpeechUI(){document.querySelectorAll('#lines .line').forEach(l=>{l.classList.remove('is-speaking');let b=l.querySelector('button');if(b){b.classList.remove('is-speaking');b.removeAttribute('aria-pressed');if(b.dataset.original)b.innerHTML=b.dataset.original}});let all=document.querySelector('.all-sounds');if(all){all.classList.remove('is-speaking');all.setAttribute('aria-pressed','false');let t=all.querySelector('.step-copy strong');if(t)t.textContent='まとめてきく'}let status=document.querySelector('#speechStatus');if(status)status.textContent='';}

function playSpeech(items,all=false){if(!('speechSynthesis'in window))return alert('このブラウザは読み上げに対応していません');stopSpeech();let run=speechRun;speechActive=true;speechAll=all;let k=0;
function next(){if(run!==speechRun)return;if(k>=items.length){speechActive=false;speechAll=false;clearSpeechUI();return}let text=items[k++],u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.78;

function updatePoints(){$('points').textContent='✦ '+state.points+' pt'}
function renderGacha(){updatePoints();$('gachaBalance').textContent='もっているポイント：'+state.points+' pt';$('drawButton').disabled=state.points<100;$('gachaHint').textContent=state.points<100?'あと '+(100-state.points)+'ポイントで ひけるよ':'1かい100ポイント。同じこがでることもあるよ。'}
function drawGacha(){if(state.points<100)return;state.points-=100;let i=Math.floor(Math.random()*species.length),fresh=!state.owned.includes(i);if(fresh)state.owned.push(i);save();renderGacha();let r=$('gachaResult');r.classList.remove('hidden');r.innerHTML='<p>'+ (fresh?'あたらしい なかま！':'また あそびにきたよ！')+'</p><div class="reward-friend">'+character(i)+'</div><h2>'+species[i]+'</h2>'+rarityTag(i)+'<p class="muted">'+(fresh?'キャラクターに なかまいり！':'すでに なかまになっているこだよ。')+'</p><button onclick="show(\'collection\')">おへやにおく ▶</button>';}
function toggleFavorite(i){if(!state.owned.includes(i))return;let at=state.favorites.indexOf(i);if(at>=0)state.favorites.splice(at,1);else if(state.favorites.length<HOME_LIMIT)state.favorites.push(i);else{alert('おへやにおけるのは5にんまで。だれかを はずしてね。');return}save();collection()}
function collection(){$('collectionCount').textContent=state.owned.length+' / '+species.length+' しゅるい ・ おへや '+state.favorites.length+' / '+HOME_LIMIT;$('monsters').innerHTML='';species.forEach((e,i)=>{let d=document.createElement('div');d.className='friend-card center card-'+rarityCodes[i].toLowerCase();if(state.owned.includes(i)){d.innerHTML=rarityTag(i)+character(i)+'<p>'+species[i]+'</p>';let b=document.createElement('button');b.textContent=state.favorites.includes(i)?'✓ おへやからはずす':'おへやにおく';if(!state.favorites.includes(i)&&state.favorites.length>=HOME_LIMIT){b.disabled=true;b.textContent='おへやがいっぱい'}b.onclick=()=>toggleFavorite(i);d.append(b)}else d.innerHTML='<div class="unknown">？</div><p class="small muted">まだであっていない</p>';$('monsters').append(d)})}home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});

if(new URLSearchParams(location.search).has('walk-review')){stopRoomWalk();document.querySelector('.app').style.display='none';let board=document.createElement('div');board.id='walk-review';board.style='padding:20px;background:#faf3e3;color:#573e25;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:absolute;inset:0;overflow:auto;z-index:999';document.body.append(board);for(let i=0;i<species.length;i++)for(let dir of ['front','side','back']){if(new URLSearchParams(location.search).has('focus')&&(i!==Number(new URLSearchParams(location.search).get('focus'))||dir!==(new URLSearchParams(location.search).get('direction')||'front')))continue;if(new URLSearchParams(location.search).has('focus'))board.style.gridTemplateColumns='1fr';let card=document.createElement('div');card.style='background:#fffdf5;border:1px solid #c8b995;border-radius:12px;padding:10px';card.innerHTML='<b>'+species[i]+' / '+dir+'</b><div style="display:flex"></div>';let row=card.querySelector('div');for(let phase of (new URLSearchParams(location.search).has('lines')?[0]:[0,Math.PI/2,Math.PI,Math.PI*1.5])){let holder=document.createElement('div');holder.style=new URLSearchParams(location.search).has('lines')?'width:100%':'width:25%';holder.innerHTML=character(i,true);row.append(holder);let svg=holder.querySelector('svg');svg.style=new URLSearchParams(location.search).has('lines')?'width:100%;height:230px':new URLSearchParams(location.search).has('focus')?'width:100%;height:450px':'width:100%;height:130px';svg.querySelectorAll('.rig-view').forEach(v=>{v.style.display=v.classList.contains('rig-'+dir)?'inline':'none';if(v.style.display==='inline')poseRig(v,dir,phase,true)});}board.append(card)}}
</script></body></html>
