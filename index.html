<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161c35"><title>九九コレクト</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#101629}*{box-sizing:border-box}body{margin:0}main{max-width:460px;margin:auto;min-height:100dvh;padding:22px 17px 95px;background:linear-gradient(#1d2c55,#101629 65%)}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}.muted{color:#bac5e4;font-size:13px}.panel{background:#273657;border:1px solid #435477;border-radius:22px;padding:20px;margin:18px 0;box-shadow:0 8px 20px #0002}button{font:inherit;border:0;cursor:pointer;border-radius:15px;padding:14px 16px;background:#fff;color:#202b48;font-weight:800}button:disabled{opacity:.45}button{touch-action:manipulation}#question{overflow-wrap:anywhere}.choices button{overflow-wrap:anywhere} .line span{font-size:clamp(14px,4vw,18px)}.primary{background:#ffcb58;color:#392c14;width:100%}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{font-size:21px;min-height:68px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:58px}.active{background:#ffcb58!important;color:#302814!important}.monster{text-align:center;font-size:92px;line-height:1.4}.big{text-align:center;font-size:33px;font-weight:900;margin:30px 0}.center{text-align:center}.line{padding:11px 13px;background:#354668;border-radius:12px;margin:7px 0;display:flex;justify-content:space-between;align-items:center}.line button{padding:7px 11px}nav{position:fixed;bottom:0;left:0;right:0;background:#17223c;display:flex;justify-content:center;padding:10px 5px max(10px,env(safe-area-inset-bottom));border-top:1px solid #405172}nav button{background:transparent;color:#cbd6ee;font-size:13px;min-width:85px;padding:10px}.hidden{display:none}.status{min-height:25px;color:#ffe28a;font-weight:700;text-align:center}.small{font-size:12px}.progress{height:9px;border-radius:9px;background:#485778;overflow:hidden}.progress span{display:block;background:#ffcc57;height:100%}.home-actions{display:grid;gap:14px;margin-top:24px}.secondary{width:100%;background:#b9dafc;color:#202b48}#home .monster{font-size:clamp(100px,30vw,150px);padding:22px 0}#danButtons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#danButtons button{min-width:0;padding:16px 4px;font-size:16px}</style></head><body><main><header><h1>🐣 九九コレクト</h1><span id="points">⭐ 0</span></header><p class="muted">きいて、おぼえて、モンスターをあつめよう！</p>
<section id="home"><div class="panel center"><div class="monster" id="hero">🥚</div><h2 id="heroName">モンスターのタマゴ</h2><p class="muted">九九をおぼえて、なかまをふやそう！</p><p class="muted" id="homeInfo"></p><div class="home-actions"><button class="primary" onclick="show('select')">九九をおぼえる ▶</button><button class="secondary" onclick="show('collection')">モンスターをみる ▶</button></div></div><p class="small muted center" id="saveStatus">この端末・ブラウザに自動でほぞんするよ。</p></section>
<section id="select" class="hidden"><div class="panel"><h2>だんをえらぶ</h2><div id="danButtons"></div><p class="muted">1のだんから9のだんまで、すきなだんをえらぼう！</p><p class="muted" id="totalProgress"></p></div><button onclick="show('home')">ホームにもどる</button></section>
<section id="learn" class="hidden"><div class="panel"><h2 id="learnTitle"></h2><button class="small" onclick="show('select')">だんをえらびなおす</button><p class="muted">おとをきいて、いっしょに声に出そう！</p><div id="lines"></div><button class="primary" onclick="speakGroup()">🔊 まとめてきく</button></div><div class="panel"><p class="muted" id="groupLabel"></p><div class="row"><button onclick="changeGroup(-1)">◀ まえ</button><button onclick="changeGroup(1)">つぎ ▶</button></div><p></p><button class="primary" onclick="startQuiz()">おぼえた！ もんだいへ ▶</button></div></section>
<section id="quiz" class="hidden"><div class="panel"><div class="muted" id="quizProgress"></div><div class="progress"><span id="bar"></span></div><div class="big" id="question"></div><div class="choices" id="choices"></div><p class="status" id="feedback" aria-live="polite"></p><button class="primary hidden" id="next" onclick="nextQuestion()">つぎへ ▶</button></div><button onclick="show('learn')">🔊 もういちど れんしゅう</button></section>
<section id="result" class="hidden"><div class="panel center"><div class="monster" id="rewardEmoji">🥚</div><h2 id="rewardTitle"></h2><p id="rewardDesc"></p><button class="primary" onclick="show('learn')">つづけて おぼえる</button><p></p><button onclick="show('collection')">ずかんをみる</button></div></section>
<section id="collection" class="hidden"><div class="panel"><h2>📖 モンスターずかん</h2><p class="muted" id="collectionCount"></p><div id="monsters" class="choices"></div></div></section>
<nav><button onclick="show('home')">🏠<div>ホーム</div></button><button onclick="show('select')">🔊<div>れんしゅう</div></button><button onclick="show('collection')">📖<div>ずかん</div></button></nav></main><script>
const readings={1:['いち','に','さん','し','ご','ろく','しち','はち','く'],2:['に','に','さん','し','ご','ろく','しち','はち','く'],3:['さん','に','さん','し','ご','ろく','しち','はち','く'],4:['し','に','さん','し','ご','ろく','しち','はち','く'],5:['ご','に','さん','し','ご','ろく','しち','はち','く'],6:['ろく','に','さん','し','ご','ろく','しち','はち','く'],7:['しち','に','さん','し','ご','ろく','しち','はち','く'],8:['はち','に','さん','し','ご','ろく','しち','はち','く'],9:['く','に','さん','し','ご','ろく','しち','はち','く']};
const special={'1-1':'いんいちがいち','1-2':'いんにがに','1-3':'いんさんがさん','1-4':'いんしがし','1-5':'いんごがご','1-6':'いんろくがろく','1-7':'いんしちがしち','1-8':'いんはちがはち','1-9':'いんくがく','2-1':'にいちがに','2-2':'ににんがし','2-3':'にさんがろく','2-4':'にしがはち','2-5':'にごじゅう','2-6':'にろくじゅうに','2-7':'にしちじゅうし','2-8':'にはちじゅうろく','2-9':'にくじゅうはち','3-1':'さんいちがさん','3-2':'さんにがろく','3-3':'さざんがく','3-4':'さんしじゅうに','3-5':'さんごじゅうご','3-6':'さぶろくじゅうはち','3-7':'さんしちにじゅういち','3-8':'さんぱにじゅうし','3-9':'さんくにじゅうしち','4-1':'しいちがし','4-2':'しにがはち','4-3':'しさんじゅうに','4-4':'ししじゅうろく','4-5':'しごにじゅう','4-6':'しろくにじゅうし','4-7':'ししちにじゅうはち','4-8':'しはさんじゅうに','4-9':'しくさんじゅうろく','5-1':'ごいちがご','5-2':'ごにじゅう','5-3':'ごさんじゅうご','5-4':'ごしにじゅう','5-5':'ごごにじゅうご','5-6':'ごろくさんじゅう','5-7':'ごしちさんじゅうご','5-8':'ごはしじゅう','5-9':'ごっくしじゅうご','6-1':'ろくいちがろく','6-2':'ろくにじゅうに','6-3':'ろくさんじゅうはち','6-4':'ろくしにじゅうし','6-5':'ろくごさんじゅう','6-6':'ろくろくさんじゅうろく','6-7':'ろくしちしじゅうに','6-8':'ろくはしじゅうはち','6-9':'ろっくごじゅうし','7-1':'しちいちがしち','7-2':'しちにじゅうし','7-3':'しちさんにじゅういち','7-4':'しちしにじゅうはち','7-5':'しちごさんじゅうご','7-6':'しちろくしじゅうに','7-7':'しちしちしじゅうく','7-8':'しちはごじゅうろく','7-9':'しちくろくじゅうさん','8-1':'はちいちがはち','8-2':'はちにじゅうろく','8-3':'はっさんにじゅうし','8-4':'はっしさんじゅうに','8-5':'はちごしじゅう','8-6':'はちろくしじゅうはち','8-7':'はちしちごじゅうろく','8-8':'はっぱろくじゅうし','8-9':'はっくしちじゅうに','9-1':'くいちがく','9-2':'くにじゅうはち','9-3':'くさんにじゅうしち','9-4':'くしさんじゅうろく','9-5':'くごしじゅうご','9-6':'くろくごじゅうし','9-7':'くしちろくじゅうさん','9-8':'くはしちじゅうに','9-9':'くくはちじゅういち'};
const numbers=['','いち','に','さん','し','ご','ろく','しち','はち','く','じゅう','じゅういち','じゅうに','じゅうさん','じゅうし','じゅうご','じゅうろく','じゅうしち','じゅうはち','じゅうく','にじゅう'];function numberRead(n){if(n<=20)return numbers[n];let t=Math.floor(n/10),u=n%10;return (t===2?'にじゅう':t===3?'さんじゅう':t===4?'しじゅう':t===5?'ごじゅう':t===6?'ろくじゅう':t===7?'しちじゅう':'はちじゅう')+(u?numbers[u]:'')}
function phrase(d,n){return special[d+'-'+n]||readings[d][0]+readings[d][n-1]+(d*n<10?'が':'')+numberRead(d*n)}
function splitPhrase(d,n){let s=phrase(d,n),v=numberRead(d*n);if(s.endsWith(v))return [s.slice(0,-v.length),v];let prefix=readings[d][0]+readings[d][n-1];return [s.slice(0,prefix.length),s.slice(prefix.length)]}
const species=['🐲','🦊','🐸','🐧','🦉','🐙','🦄','🐢','🐼','🦋','🐝','🦖','🐳','🦀','🐺','🐱','🐻','🦁','🐨','🐯','🐰','🐿️','🐊','🦜','🐬','🦔','🦩','🐘','🦕','🐉'];
let state;try{state=JSON.parse(localStorage.getItem('kuku-save-v1'))||{points:0,owned:[],clears:{}}}catch(e){state={points:0,owned:[],clears:{}}}
let dan=1,group=0,questions=[],index=0,answered=false,correct=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('kuku-save-v1',JSON.stringify(state))}catch(e){$('saveStatus').textContent='ほぞんできません。ブラウザの設定を確認してください。';alert('進みぐあいを保存できませんでした。ブラウザの空き容量や設定を確認してください。')}}function speak(t){if(!('speechSynthesis'in window))return alert('このブラウザは読み上げに対応していません');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.78;speechSynthesis.speak(u)}function show(id){if('speechSynthesis' in window)speechSynthesis.cancel();['home','select','learn','quiz','result','collection'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='home'||id==='select')home();if(id==='learn')renderLearn();if(id==='collection')collection();window.scrollTo(0,0)}
function home(){$('points').textContent='⭐ '+state.points;$('hero').textContent='🥚';$('heroName').textContent='モンスターのタマゴ';$('homeInfo').textContent=state.owned.length+' / 30 しゅるい あつめた';$('totalProgress').textContent='クリアしたれんしゅう：'+Object.keys(state.clears).length+' / 27';$('danButtons').innerHTML='';for(let d=1;d<=9;d++){let b=document.createElement('button');b.textContent=d+'のだん'+([0,1,2].every(g=>state.clears[d+'-'+g])?' ✓':'');b.className=d===dan?'active':'';b.onclick=()=>{dan=d;group=0;show('learn')};$('danButtons').append(b)}}
function renderLearn(){$('learnTitle').textContent=dan+'のだん';$('groupLabel').textContent='その'+(group+1)+' / 3　（'+(group*3+1)+'〜'+(group*3+3)+'）'+(state.clears[dan+'-'+group]?' ✓ クリア':'');$('lines').innerHTML='';for(let n=group*3+1;n<=group*3+3;n++){let line=document.createElement('div');line.className='line';let span=document.createElement('span');span.textContent=phrase(dan,n);let btn=document.createElement('button');btn.textContent='🔊';btn.onclick=()=>speak(phrase(dan,n));line.append(span,btn);$('lines').append(line)}}
function speakGroup(){speak([1,2,3].map(x=>phrase(dan,group*3+x)).join('。'))}function changeGroup(delta){group=Math.max(0,Math.min(2,group+delta));renderLearn()}
function startQuiz(){questions=[1,2,3].map(x=>group*3+x);for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}index=0;correct=0;show('quiz');renderQuestion()}
function renderQuestion(){answered=false;$('next').classList.add('hidden');$('feedback').textContent='';let n=questions[index],parts=splitPhrase(dan,n);$('question').textContent=parts[0]+' ○○';$('quizProgress').textContent=dan+'のだん　'+(index+1)+' / '+questions.length;$('bar').style.width=((index)/questions.length*100)+'%';let answers=[parts[1]];let candidates=[];for(let j=1;j<=9;j++){if(j!==n)candidates.push(splitPhrase(dan,j)[1])}candidates=[...new Set(candidates)].filter(x=>x!==parts[1]);candidates.sort(()=>Math.random()-.5);answers.push(...candidates.slice(0,3));answers.sort(()=>Math.random()-.5);$('choices').innerHTML='';answers.forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>choose(a,parts[1],n);$('choices').append(b)})}
function choose(a,expected,n){if(answered)return;answered=true;let ok=a===expected;if(ok)correct++;$('feedback').textContent=ok?'せいかい！ 🎉':'おしい！ '+phrase(dan,n)+' だよ';speak(phrase(dan,n));[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===expected)b.style.background='#91e7ad';else if(b.textContent===a&&!ok)b.style.background='#ff9b9b'});$('next').textContent=index===questions.length-1?'けっかをみる ▶':'つぎへ ▶';$('next').classList.remove('hidden')}
function nextQuestion(){index++;if(index<questions.length)renderQuestion();else finish()}
function finish(){let key=dan+'-'+group,first=!state.clears[key],perfect=correct===3;state.points+=correct*10;let award=perfect;if(award){state.clears[key]=true;if(state.owned.length<species.length){let available=species.map((_,i)=>i).filter(i=>!state.owned.includes(i));let chosen=available[Math.floor(Math.random()*available.length)];state.owned.push(chosen);$('rewardEmoji').textContent=species[chosen];$('rewardTitle').textContent='あたらしい なかま！';$('rewardDesc').textContent='3もん ぜんぶせいかい！ モンスターをゲット！'}else{$('rewardEmoji').textContent='🏆';$('rewardTitle').textContent='コンプリート！';$('rewardDesc').textContent='ぜんぶのモンスターをあつめたよ！'}}else{$('rewardEmoji').textContent=perfect?'🌟':'💪';$('rewardTitle').textContent=correct+' / 3 もん せいかい';$('rewardDesc').textContent=perfect?'よくできたね！ つぎの九九にもチャレンジ！':'まちがえた九九をもういちどきいてみよう！'}save();$('points').textContent='⭐ '+state.points;show('result')}
function collection(){$('collectionCount').textContent=state.owned.length+' / '+species.length+' しゅるい';$('monsters').innerHTML='';species.forEach((e,i)=>{let d=document.createElement('div');d.className='panel center';d.style.margin='0';d.style.padding='13px 3px';d.innerHTML='<div style="font-size:46px">'+(state.owned.includes(i)?e:'❔')+'</div><div class="small">'+(state.owned.includes(i)?'No.'+(i+1):'？？？')+'</div>';$('monsters').append(d)})}home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
