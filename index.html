// Cache three alpha silhouettes per companion. Reuse the room animation lifecycle.
const hbkAuraCache=new Map(),hbkReduced=matchMedia('(prefers-reduced-motion: reduce)');
function hbkAuraAssets(i){
 if(hbkAuraCache.has(i))return hbkAuraCache.get(i);
 const entry={ready:false,views:[]},a=rigAssets[i],image=new Image();hbkAuraCache.set(i,entry);
 image.onload=()=>{for(let k=0;k<3;k++){
  const mask=document.createElement('canvas');mask.width=248;mask.height=240;const m=mask.getContext('2d',{willReadFrequently:true});m.scale(2,2);m.translate(12,0);
  const br=a.parts[k*3],h=90,w=h*br[2]/br[3],x=50-w*a.hips[k];
  m.save();if(((a.mirrorSide&&k===1)||(a.mirrorBack&&k===2))){m.translate(100,0);m.scale(-1,1)}m.drawImage(image,br[0]*image.naturalWidth/a.w,br[1]*image.naturalHeight/a.h,br[2]*image.naturalWidth/a.w,br[3]*image.naturalHeight/a.h,x,11,w,h);m.restore();
  m.fillStyle='#fff';[k===1?45:36,k===1?55:64].forEach(cx=>{m.beginPath();m.ellipse(cx,105,11.5,7,0,0,Math.PI*2);m.fill()});
  const pixels=m.getImageData(0,0,248,240).data,edges=[[],[]];for(let y=20;y<224;y+=4){let l=248,r=-1;for(let x=0;x<248;x++)if(pixels[(y*248+x)*4+3]>100){l=Math.min(l,x);r=x}if(r>=l){edges[0].push([l/2,y/2]);edges[1].push([r/2,y/2])}}
  m.setTransform(1,0,0,1,0,0);m.globalCompositeOperation='source-in';m.fillStyle='#ec304d';m.fillRect(0,0,248,240);entry.views.push({mask,edges});
 }entry.ready=true};image.src=a.src;return entry;
}
function paintHBKAura(w,now){
 const i=Number(w.el.dataset.character);if(i<3||i>5)return;
 const canvas=w.el.querySelector('.hbk-canvas'),assets=hbkAuraAssets(i);if(!canvas||!assets.ready)return;
 if(now-(canvas._auraFrame||0)<33)return;canvas._auraFrame=now;
 const k=w.view==='side'?1:w.view==='back'?2:0,{mask,edges}=assets.views[k],c=canvas.getContext('2d'),still=hbkReduced.matches,t=still?1:now/1000+(i-3)*1.8;
 c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,248,240);c.save();c.scale(2,2);if(w.face<0){c.translate(124,0);c.scale(-1,1)}

 // Expand the silhouette beyond the artwork: an exact-size glow was hidden under it.

 for(let n=0;n<12;n++){const a=n*Math.PI/6;c.drawImage(mask,Math.cos(a)*3.5,Math.sin(a)*3.5,124,120)}

  }});

  }

}

function startQuiz(){questions=[1,2,3].map(x=>group*3+x);for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}index=0;correct=0;show('quiz');renderQuestion()}
function renderQuestion(){answered=false;$('next').classList.add('hidden');$('feedback').textContent='';let n=questions[index],parts=splitPhrase(dan,n);$('question').textContent=parts[0]+' ○○';$('quizEquation').textContent=dan+' × '+n+' ＝ □';$('quizProgress').textContent=dan+'のだん　'+(index+1)+' / '+questions.length;$('bar').style.width=((index)/questions.length*100)+'%';let answers=[parts[1]];let candidates=[];for(let j=1;j<=9;j++){if(j!==n)candidates.push(splitPhrase(dan,j)[1])}candidates=[...new Set(candidates)].filter(x=>x!==parts[1]);candidates.sort(()=>Math.random()-.5);answers.push(...candidates.slice(0,3));answers.sort(()=>Math.random()-.5);$('choices').innerHTML='';answers.forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>choose(a,parts[1],n);$('choices').append(b)})}

roomWalkers=[...area.querySelectorAll('.room-friend')].map((el,i)=>{let w={el,x:(aw-el.offsetWidth)*(i+1)/(area.children.length+1),y:ah*(.25+(i%3)*.3),phase:Math.random()*Math.PI*2,wait:1+i*.5,view:'front',face:1,speed:18};destination(w);return w});let last=0;function tick(t){let dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!$('home').classList.contains('hidden')&&!document.hidden){for(let w of roomWalkers){let moving=false;if(w.wait>0){w.wait-=dt;w.view='front';w.face=1;if(w.wait<=0)destination(w)}else{let dx=w.tx-w.x,dy=w.ty-w.y,dist=Math.hypot(dx,dy);if(dist<1){w.wait=1.5+Math.random()*3}else{let step=Math.min(dist,w.speed*dt);w.x+=dx/dist*step;w.y+=dy/dist*step;w.phase+=step/15*Math.PI*2;moving=true;if(Math.abs(dy)>Math.abs(dx)*.8){w.view=dy<0?'back':'front';w.face=1}else{w.view='side';w.face=dx<0?-1:1}}}
let depth=w.y/ah,scale=1;w.el.style.transform='translate('+w.x+'px,'+(w.y-ah)+'px) scale('+scale+')';w.el.style.zIndex=String(Math.round(100+depth*100));w.el.classList.toggle('is-walking',moving);w.el.dataset.direction=w.view;w.el.dataset.facing=w.face===-1?'left':'right';w.el.querySelector('.walk-facing').style.transform='scaleX('+w.face+')';let phase=w.phase;w.el.querySelectorAll('.rig-view').forEach(v=>{let on=v.classList.contains('rig-'+w.view);v.style.display=on?'inline':'none';if(!on)return;poseRig(v,w.view,phase,moving,t)});paintHBKAura(w,t)}}walkFrame=requestAnimationFrame(tick)}walkFrame=requestAnimationFrame(tick)}
if(!Array.isArray(state.favorites))state.favorites=[];
function updatePoints(){$('points').textContent='✦ '+state.points+' pt'}
function renderGacha(){updatePoints();$('gachaBalance').textContent='もっているポイント：'+state.points+' pt';$('drawButton').disabled=state.points<100;$('gachaHint').textContent=state.points<100?'あと '+(100-state.points)+'ポイントで ひけるよ':'1かい100ポイント。同じこがでることもあるよ。'}
function drawGacha(){if(state.points<100)return;state.points-=100;let i=Math.floor(Math.random()*species.length),fresh=!state.owned.includes(i);if(fresh)state.owned.push(i);save();renderGacha();let r=$('gachaResult');r.classList.remove('hidden');r.innerHTML='<p>'+ (fresh?'あたらしい なかま！':'また あそびにきたよ！')+'</p><div class="reward-friend">'+character(i)+'</div><h2>'+species[i]+'</h2>'+rarityTag(i)+'<p class="muted">'+(fresh?'キャラクターに なかまいり！':'すでに なかまになっているこだよ。')+'</p><button onclick="show(\'collection\')">おへやにおく ▶</button>';}
function toggleFavorite(i){if(!state.owned.includes(i))return;let at=state.favorites.indexOf(i);if(at>=0)state.favorites.splice(at,1);else if(state.favorites.length<HOME_LIMIT)state.favorites.push(i);else{alert('おへやにおけるのは5にんまで。だれかを はずしてね。');return}save();collection()}
function collection(){$('collectionCount').textContent=state.owned.length+' / '+species.length+' しゅるい ・ おへや '+state.favorites.length+' / '+HOME_LIMIT;$('monsters').innerHTML='';species.forEach((e,i)=>{let d=document.createElement('div');d.className='friend-card center card-'+rarityCodes[i].toLowerCase();if(state.owned.includes(i)){d.innerHTML=rarityTag(i)+character(i)+'<p>'+species[i]+'</p>';let b=document.createElement('button');b.textContent=state.favorites.includes(i)?'✓ おへやからはずす':'おへやにおく';if(!state.favorites.includes(i)&&state.favorites.length>=HOME_LIMIT){b.disabled=true;b.textContent='おへやがいっぱい'}b.onclick=()=>toggleFavorite(i);d.append(b)}else d.innerHTML='<div class="unknown">？</div><p class="small muted">まだであっていない</p>';$('monsters').append(d)})}home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});

if(new URLSearchParams(location.search).has('walk-review')){stopRoomWalk();document.querySelector('.app').style.display='none';let board=document.createElement('div');board.id='walk-review';board.style='padding:20px;background:#faf3e3;color:#573e25;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:absolute;inset:0;overflow:auto;z-index:999';document.body.append(board);for(let i=0;i<species.length;i++)for(let dir of ['front','side','back']){let query=new URLSearchParams(location.search);if(i<Number(query.get('from')||0)||i>=Number(query.get('to')||species.length))continue;if(new URLSearchParams(location.search).has('focus')&&(i!==Number(new URLSearchParams(location.search).get('focus'))||dir!==(new URLSearchParams(location.search).get('direction')||'front')))continue;if(new URLSearchParams(location.search).has('focus'))board.style.gridTemplateColumns='1fr';let card=document.createElement('div');card.style='background:#fffdf5;border:1px solid #c8b995;border-radius:12px;padding:10px';card.innerHTML='<b>'+species[i]+' / '+dir+'</b><div style="display:flex"></div>';let row=card.querySelector('div');for(let phase of (new URLSearchParams(location.search).has('lines')?[0]:[0,Math.PI/2,Math.PI,Math.PI*1.5])){let holder=document.createElement('div');holder.style=new URLSearchParams(location.search).has('lines')?'width:100%':'width:25%';holder.innerHTML=character(i,true);row.append(holder);let svg=holder.querySelector('svg');svg.style=new URLSearchParams(location.search).has('lines')?'width:100%;height:230px':new URLSearchParams(location.search).has('focus')?'width:100%;height:450px':'width:100%;height:130px';svg.querySelectorAll('.rig-view').forEach(v=>{v.style.display=v.classList.contains('rig-'+dir)?'inline':'none';if(v.style.display==='inline')poseRig(v,dir,phase,true)});}board.append(card)}}
</script></body></html>
