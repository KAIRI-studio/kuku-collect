<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九九コレクト 画面確認</title><style>body{margin:0;background:#e9e2d3;font:14px system-ui;color:#65482d}header{padding:12px;display:flex;gap:12px;align-items:center}button,select{font:inherit;padding:8px}iframe{display:block;border:0;margin:0 auto;background:#faf3e3}</style><header><label>端末サイズ <select id="size" onchange="resize()"><option value="390,844">390 × 844</option><option value="375,667">375 × 667</option><option value="320,568">320 × 568</option><option value="460,1000">460 × 1000</option></select></label><button onclick="launch(false)">全キャラ確認</button><button onclick="launch(true)">はじめから確認</button></header><iframe id="game" title="ゲーム確認" width="390" height="844"></iframe><script>function resize(){let [w,h]=document.getElementById('size').value.split(',');let f=document.getElementById('game');f.width=w;f.height=h}function launch(fresh){document.getElementById('game').src='../../?'+(fresh?'preview-progress':'preview-roster')+'=1&screen-review=title&v=experience2'}resize();launch(false);</script></html>
