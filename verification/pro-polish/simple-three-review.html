<!doctype html><meta charset="utf-8"><title>三方向比較</title><style>body{background:#faf3e3;font:12px system-ui;color:#432713}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.row{background:#fff8e8;border:1px solid #ceb894;padding:5px}.poses{display:flex}.poses>svg{width:33.333%;height:105px;overflow:visible}iframe{width:390px;height:760px;border:0}button{padding:10px}</style><button onclick="gallery()">全50体・三方向</button><button onclick="document.getElementById('grid').hidden=true;document.getElementById('game').hidden=false">ホーム歩行</button><div id="grid"></div><iframe id="game" src="../../?preview-roster=1&preview-refine=1&screen-review=title"></iframe><script>function gallery(){let w=document.getElementById('game').contentWindow,g=document.getElementById('grid');g.hidden=false;g.innerHTML='';for(let i=0;i<50;i++){let row=document.createElement('div');row.className='row';row.innerHTML='<b>'+i+'</b><div class="poses">'+[0,1,2].map(()=>w.character(i)).join('')+'</div>';row.querySelectorAll('.poses>svg').forEach((svg,k)=>svg.querySelectorAll('.rig-view').forEach((v,n)=>v.style.display=n===k?'inline':'none'));row.querySelectorAll('image').forEach(im=>im.setAttribute('href',new URL(im.getAttribute('href'),w.location.href).href));g.append(row)}document.getElementById('game').hidden=true}</script>
